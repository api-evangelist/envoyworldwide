name: EnvoyWorldWide
description: EnvoyWorldWide (Envoy WorldWide, Inc.) was a Massachusetts-based automated notification
  and interactive multi-channel messaging company, backed by Battery Ventures, that sold hosted alerting
  and customer-communication services. The company rebranded as Varolii Corporation in the mid-2000s,
  and the envoyworldwide.com property was retired. As of this enrichment pass the domain has no A record
  and its most recent archived captures show a parked "Under Construction" placeholder rather than a
  company site. No developer portal, documentation, API reference, SDK, package, or GitHub organization
  could be located on any public surface. This profile is retained as a historical network entry with
  no active API surface.
